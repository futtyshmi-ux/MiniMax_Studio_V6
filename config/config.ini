[vram]
reserve_gb=3
dynamic_vram=1
; (правка) Загрузка больших моделей (~20 ГБ): 0 = синхронно (стабильно, по
; умолчанию; обходит баг comfy-aimdo 0.4.13 «hostbuf_file_reader_read failed»
; на Windows + NVIDIA), 1 = async-офлоад (быстрее загрузка, но на RTX 50xx
; может падать с GetOverlappedResult 1450/1453).
async_offload=0

[comfy]
turbo_lora=
; (правка 148) Основная diffusion-модель: FastVideo VSA DataFree 1300-step 4-step int8 convrot.
; Пустое значение = дефолт из кода (fastvideo_fasth3_8step_v2_pruned_int8_convrot.safetensors).
diffusion_model=
; comfy_dir не нужен — путь зашит в start.bat / start_comfy.bat:
; ComfyUI-Easy-Install (в корне проекта).
; Если хотите переопределить для Web UI, раскомментируйте:
; comfy_dir=ComfyUI-Easy-Install


[llm]
repeat_penalty=1
frequency_penalty=0
presence_penalty=0
min_p=0.05
top_k=40
top_p=0.95
temperature=0.7
sampling_override=0
kv_cache=q4_0
video_vision=0
model=
max_output_tokens=4096
; (правка 119) дефолт — 25K токенов
context_size=25600
device=auto

[ui]
sound_on=1

[stt]
dir=
threads=0
language=ru
model=
enabled=1

[upscale]
; (правка 74) Вкладка Upscale — встроенный DLSS 5 Visual Enhancer (upscale/).
enabled=1
; Порт DLSS-моста (bridge.py). 7860 занят другими сервисами, используем 7890.
port=7890